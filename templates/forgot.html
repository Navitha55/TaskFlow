{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow | Reset Password</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <link rel="icon" href="{% static 'favicon.jpg' %}">
</head>

<body>
    <main>
        <button id="theme-toggle">
            🌙
        </button>
        <section id="intro">
            <div class="hero-content">
                <h1 class="hero-title">
                    Take Back Control with <span>TaskFlow</span>
                </h1>
            </div>
            <div id="signin" class="form-box active">
                <div class="form-icon">
                    🔐
                </div>
                <h2>Reset Your Password</h2>
                <p class="form-subtitle">
                    Forgot your password? No worries.
                    Enter your registered email and create a new password
                    to get back to your tasks.
                </p>
                <form method="POST" action="{% url 'forgot' %}">
                    {% csrf_token %}
                    <input type="email" name="email" placeholder="Registered Email" autocomplete="email" required>
                    <div class="password-field">
                        <input type="password" name="password" id="password" placeholder="Password" required>

                        <button type="button" class="toggle-password" onclick="togglePassword('password', this)">
                            🤫
                        </button>
                    </div>
                    <div class="password-field">
                        <input type="password" name="confirm_password" id="confirm_password"
                            placeholder="Confirm Password" required>

                        <button type="button" class="toggle-password"
                            onclick="togglePassword('confirm_password', this)">
                            🤫
                        </button>
                    </div>
                    <button class="submit-btn" type="submit">
                        Reset Password
                    </button>
                </form>
                <p class="back-login">
                    Remember your password?
                    <a href="{% url 'signIn' %}">
                        Back to Sign In
                    </a>
                </p>
            </div>
        </section>
    </main>
    <script src="{% static 'script.js' %}"></script>
</body>

</html>
